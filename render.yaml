services:
  - type: web
    name: busan-trade-report
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: CLOUD_MODE
        value: "1"
      - key: APP_USERNAME
        value: report
      - key: APP_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.10
